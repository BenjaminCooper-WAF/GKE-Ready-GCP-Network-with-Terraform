name: Deploy Portfolio and Publish Release

on:
  workflow_dispatch:
    inputs:
      source_repo:
        required: false
        type: string
      source_repo_url:
        required: false
        type: string
      commit_message:
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Portfolio
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AWS LOGIN
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # DEPLOY WEBSITE TO S3
      - name: Deploy site to S3
        run: |
          aws s3 sync ./site s3://${{ secrets.S3_BUCKET_NAME }} --delete

      # CLEAR CLOUDFRONT CACHE
      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
  linkedin-release:
    name: Publish LinkedIn Release
    needs:
      - deploy

    if: >
      success() &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, 'release:'))

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Publish LinkedIn post
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          RELEASE_MESSAGE: ${{ github.event.inputs.commit_message || github.event.head_commit.message }}
          SOURCE_REPO: ${{ github.event.inputs.source_repo || github.repository }}
          SOURCE_REPO_URL: ${{ github.event.inputs.source_repo_url || format('https://github.com/{0}', github.repository) }}
          PORTFOLIO_URL: https://benjaminc.cloud
          GITHUB_URL: https://github.com/BenjaminCooper-WAF

        run: |
          python scripts/linkedin-post.py